name: NazRiy release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nazriy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nazriy_test
          POSTGRES_USER: nazriy
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nazriy -d nazriy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DB_ENGINE: postgres
      DB_NAME: nazriy_test
      DB_USER: nazriy
      DB_PASSWORD: test-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      USE_SUPABASE_STORAGE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test store

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  production-check:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ci-production-check-secret-key-that-is-longer-than-fifty-characters-only
      DJANGO_ALLOWED_HOSTS: example.com
      CORS_ALLOWED_ORIGINS: https://example.com
      CSRF_TRUSTED_ORIGINS: https://example.com
      DB_ENGINE: postgres
      DB_NAME: nazriy_production_check
      DB_USER: nazriy
      DB_PASSWORD: check-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      USE_SUPABASE_STORAGE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py collectstatic --noinput
